name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint and format checks
        run: npm run lint
      - name: Test suite (engine, time/timezone, storage/migration, privacy guard, demo, build)
        run: npm test
      - name: Build deployable artifact
        run: npm run build
      - name: Smoke test the artifact
        run: |
          test -f dist/index.html
          test -f dist/standalone/index.html
          node -e "const s=require('fs').readFileSync('dist/standalone/index.html','utf8');const m=s.match(/<script>\n([\s\S]*)\n<\/script>/);new Function(m[1]);console.log('standalone bundle parses OK')"
      - name: PWA files present
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
      - name: No private or personal data in the artifact
        run: |
          ! grep -riE "$(echo aXNhZG9yYQ== | base64 -d)|$(echo bHVuYV8= | base64 -d)" dist/ || (echo 'personal data in dist' && exit 1)
          test ! -d dist/private-local-data
          test ! -d dist/tests
          test ! -d dist/docs
      - name: Upload Pages artifact (dist only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deploys ONLY the dist/ artifact built above, and only if every quality
  # gate passed (the job dependency IS the gate).
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
