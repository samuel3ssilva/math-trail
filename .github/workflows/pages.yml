name: Deploy to GitHub Pages

# Deploys ONLY the dist/ artifact produced by the CI workflow, and only
# after every quality gate in CI has passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Gate: the CI run must have succeeded (or this is a manual dispatch).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - name: Rebuild artifact (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run lint
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: dist
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
